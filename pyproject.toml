[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yaploq"
version = "0.5.0"
description = "Multi-provider TTS automation for streamers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "boto3>=1.35",
  "miniaudio>=1.61",
  "websockets>=14.2",
  "resvg_py==0.5.0",
]

[project.optional-dependencies]
google = ["google-auth>=2.0"]

[project.scripts]
yaploq = "voice_studio_speaker_bridge.app:main"
voice-studio-speaker-bridge = "voice_studio_speaker_bridge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
