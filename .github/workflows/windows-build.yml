name: Windows preview build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Keep the existing released application's manual build off the redesign branch.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e ".[google]" pytest pyinstaller cffi
      - name: Test
        run: python -m pytest -q
      - name: Verify desktop UI
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_wpf_functions.ps1
      - name: Verify History and Rules controls
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_history_rules_ui.ps1
      - name: Verify branding
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_branding.ps1
      - name: Package
        run: python -m PyInstaller --noconfirm YapLoq.spec
      - name: Verify packaged runtime
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'yaploq-package-check.json'
          $process = Start-Process -FilePath (Resolve-Path 'dist/YapLoq/YapLoq.exe') -ArgumentList @('--verify-package-output', ('"' + $report + '"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { throw 'Packaged runtime check timed out' }
          if (-not (Test-Path -LiteralPath $report)) { throw 'Packaged runtime did not produce its report' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $result | ConvertTo-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok -or -not $result.frozen) { throw 'Packaged runtime check failed' }
      - name: Include user documentation
        shell: powershell
        run: |
          Copy-Item -LiteralPath 'QUICK START.txt','LICENSE','THIRD_PARTY_NOTICES.md','README.md','ROADMAP.md','CHANGELOG.md','CODE_OF_CONDUCT.md','SECURITY.md','CONTRIBUTING.md' -Destination dist/YapLoq
          Copy-Item -LiteralPath docs -Destination dist/YapLoq/docs -Recurse -Force
          # Also surface these at package root for unzip-and-read
          Copy-Item -LiteralPath 'docs/LEGAL.md','docs/RELEASE_NOTES.md' -Destination dist/YapLoq -Force
      - name: Prepare verified in-app update package (does not publish a release)
        shell: powershell
        run: |
          $version = python -c "from voice_studio_speaker_bridge import __version__; print(__version__)"
          python tools/package_update.py --source dist/YapLoq --output dist-updates/YapLoq-Windows-x64-update.zip --version $version --channel stable
      - uses: actions/upload-artifact@v4
        with:
          name: YapLoq-0.5.0-preview-Windows
          path: dist/YapLoq/
      - uses: actions/upload-artifact@v4
        with:
          name: YapLoq-stable-update-package
          path: dist-updates/YapLoq-Windows-x64-update.zip
