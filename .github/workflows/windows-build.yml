name: Windows preview build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e . pytest pyinstaller cffi
      - name: Test
        run: python -m pytest -q
      - name: Verify desktop UI
        shell: powershell
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tests/test_wpf_functions.ps1
      - name: Package
        run: python -m PyInstaller --noconfirm VoxRelay.spec
      - name: Include user documentation
        shell: powershell
        run: |
          Copy-Item -LiteralPath 'QUICK START.txt','LICENSE','THIRD_PARTY_NOTICES.md','README.md','ROADMAP.md','CHANGELOG.md' -Destination dist/VoxRelay
          Copy-Item -LiteralPath docs -Destination dist/VoxRelay/docs -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: VoxRelay-Windows-preview
          path: dist/VoxRelay/
